packages:
  - apps/*
  - packages/*

# pnpm bloquea por defecto los scripts de instalación de dependencias.
# `onlyBuiltDependencies` (pnpm 10) y `allowBuilds` (pnpm 12+) declaran los
# paquetes autorizados a ejecutar scripts (módulos nativos o binarios).
# Se mantienen ambas claves para compatibilidad entre versiones de pnpm.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  argon2: true
  bufferutil: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  prisma: true
  secp256k1: true
  unrs-resolver: true
  utf-8-validate: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - argon2
  - bufferutil
  - esbuild
  - keccak
  - msgpackr-extract
  - prisma
  - secp256k1
  - unrs-resolver
  - utf-8-validate

# HT-14: excepciones de `pnpm audit --prod --audit-level=high` (R3 del plan de S4), revisadas el
# 25/10/2026. Se retiran cuando Renovate traiga la versión corregida con dos semanas de antigüedad.
# Revisión: 08/11/2026.
auditConfig:
  ignoreGhsas:
    # zod 4.6.6 (corrección) se publicó el 11/10/2026: aún no cumple dos semanas.
    - GHSA-mrhx-c7xc-m3w5
    # body-parser 2.4.0 y multer 2.5.0 se publicaron el 22/10/2026 (vía express de NestJS).
    - GHSA-27r3-jxmh-p828
    - GHSA-q7qp-rjg7-q26m
    # mysql2: solo lo carga el CLI de Prisma para MySQL; el proyecto usa PostgreSQL.
    - GHSA-3f6p-5ww8-9rcr
    # deepmerge-ts 8 es un salto mayor dentro de @prisma/config (CLI); se espera a Prisma.
    - GHSA-ggr8-5vv4-36mx
