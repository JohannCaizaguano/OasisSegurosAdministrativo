packages:
  - apps/*
  - packages/*

# pnpm >= 10 bloquea por defecto los scripts de instalación de dependencias.
# Aquí se declaran los paquetes que sí necesitan ejecutar scripts (postinstall,
# prebuild, etc.) por usar módulos nativos o binarios descargables.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - argon2
  - bufferutil
  - esbuild
  - keccak
  - msgpackr-extract
  - prisma
  - secp256k1
  - unrs-resolver
  - utf-8-validate
