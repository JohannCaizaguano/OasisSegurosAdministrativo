global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'oasis-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']

  # El worker no expone la API HTTP, pero sí un exporter mínimo para que las
  # métricas del anclaje (recibos_anclados_total, recibo_anclaje_latencia_
  # segundos, recibos_pendientes_anclaje) existan. Solo en la red interna.
  - job_name: 'oasis-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9101']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
