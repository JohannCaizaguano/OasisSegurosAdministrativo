name: oasis-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: oasis-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oasis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oasis}
      POSTGRES_DB: ${POSTGRES_DB:-oasis}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-oasis} -d ${POSTGRES_DB:-oasis}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oasis-redis-dev
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Nodo Hardhat local. En Windows puede ejecutarse nativamente como
  # alternativa: pnpm --filter @oasis/contracts hardhat node
  hardhat-node:
    image: node:24
    container_name: oasis-hardhat-dev
    working_dir: /workspace
    ports:
      - '8545:8545'
    volumes:
      - ./:/workspace
      - hardhat_root_modules:/workspace/node_modules
      - hardhat_contracts_modules:/workspace/packages/contracts/node_modules
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @oasis/contracts hardhat node --hostname 0.0.0.0"

volumes:
  pgdata_dev:
  redisdata_dev:
  hardhat_root_modules:
  hardhat_contracts_modules:
