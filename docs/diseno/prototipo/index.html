<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRPP Oasis Seguros · Prototipo navegable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: slim prototype bar on top; login = photo with centered welcome + form; staff = icon rail + workspace; insured = phone frame beside a test guide.
   Palette: Claroscuro (black and gold), set explicitly so it ignores the host theme. Tokens mirror apps/web/DESIGN.md. */
:root{
  --bg:#f0efed; --surface:#ffffff; --sunk:#e6e4e0; --ink:#1e1e1e; --ink2:#57514a; --line:#8a857d; --hair:#dedcd8;
  --brand:#1e1e1e; --brand-hover:#3a3631; --on-brand:#ffffff; --link:#8a6630;
  --rail:#1e1e1e; --rail-2:#2c2a27; --rail-ink:#f0efed; --rail-mute:#a39b90; --gold:#e2bf7d; --on-gold:#1a140c;
  --focus:rgba(138,102,48,.32); --shadow:0 0 0 1px #e0deda,0 4px 16px rgba(30,30,30,.05); --shadow-lg:0 24px 60px rgba(30,30,30,.28);
  --r-s:6px; --r:8px; --r-l:12px; --r-xl:16px;
  --display:'Outfit',system-ui,sans-serif; --dw:700; --body:'Figtree',system-ui,sans-serif;
  --ok:#2f6b3a; --ok-bg:#eaf4e4; --info:#2b5c87; --info-bg:#e6f0f7; --warn:#8c4f0a; --warn-bg:#fcefd9; --bad:#a1452c; --bad-bg:#fbe8e4; --void:#57514a; --void-bg:#e6e4e0;
  --bar:#0f0d0a; --bar-ink:#f0efed; --bar-mute:#a39b90; --device:#0d0b09;
  --metal:linear-gradient(135deg,#efd395 0%,#d9b46a 55%,#c39a55 100%);
  --glow:radial-gradient(120% 130% at 0% 0%,rgba(226,191,125,.22),rgba(226,191,125,0) 60%);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);caret-color:var(--ink);accent-color:var(--brand);scrollbar-color:var(--rail-mute) transparent}
::selection{background:var(--gold);color:var(--on-gold)}
a{text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rail :focus-visible,.pbar :focus-visible,.hero :focus-visible,.summary :focus-visible,.kpi.dark :focus-visible,.toast :focus-visible{outline-color:var(--gold)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* prototype bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--bar-ink);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
.pbar b{font-weight:700;letter-spacing:.02em}
.pbar .lbl{color:var(--bar-mute);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--bar-ink);height:30px;padding:0 13px;border-radius:999px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.pbar .grow{flex:1}
.pbar .ghost{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--bar-ink);height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
.grp{display:inline-flex;gap:8px;align-items:center}

/* common controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:var(--r);font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s var(--ease),background-color .2s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-p:hover{background:var(--brand-hover)}
.btn-s{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn-q{background:var(--sunk);color:var(--ink)}
.btn-bad{background:var(--surface);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn-lg{min-height:52px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field .hint{font-weight:400;font-size:13px;color:var(--ink2)}
.field .err{font-weight:500;font-size:13px;color:var(--bad)}
.inp{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:400;font-size:16px;width:100%;min-width:0}
textarea.inp{height:auto;padding:12px 14px;resize:vertical}
.inp:focus{outline:0;border:2px solid var(--brand);box-shadow:0 0 0 4px var(--focus);padding-left:13px}
.inp[aria-invalid="true"]{border:2px solid var(--bad)}
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 11px 4px 8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-info{background:var(--info-bg);color:var(--info)} .s-warn{background:var(--warn-bg);color:var(--warn)} .s-bad{background:var(--bad-bg);color:var(--bad)} .s-void{background:var(--void-bg);color:var(--void)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--void-bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.muted{color:var(--ink2)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);line-height:1.45}
.alert svg{flex:none;width:20px;height:20px;margin-top:1px}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;padding:13px 16px;border-radius:var(--r);background:var(--bar);color:var(--bar-ink);box-shadow:var(--shadow-lg);animation:toastIn .35s var(--ease)}
.toast svg{flex:none;width:20px;height:20px;color:var(--gold)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* login */
.login{display:flex;flex-wrap:wrap;min-height:100vh}
.login .photo{flex:1 1 480px;position:relative;min-height:560px;background:#1e1e1e url(oasis.jpg) center/cover;display:flex;flex-direction:column;align-items:center;padding:clamp(48px,10vh,120px) 24px 64px;overflow:hidden;text-align:center}
.login .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,10,.7) 0%,rgba(15,13,10,.38) 42%,rgba(15,13,10,.12) 68%,rgba(15,13,10,.4) 100%)}
.welcome{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:680px;isolation:isolate}
.welcome::before{content:"";position:absolute;z-index:-1;left:-12%;right:-12%;top:38%;bottom:-28%;background:radial-gradient(closest-side,rgba(15,13,10,.72),rgba(15,13,10,.45) 60%,rgba(15,13,10,0));pointer-events:none}
.welcome img{width:clamp(150px,17vw,236px);height:auto;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5));animation:pop .8s .15s var(--ease) both}
.welcome h2{margin-top:clamp(28px,5vh,56px);font:var(--dw) clamp(30px,3.4vw,48px)/1.1 var(--display);letter-spacing:-.015em;color:#f6efe2;text-shadow:0 2px 18px rgba(0,0,0,.45);animation:rise .7s .1s var(--ease) both}
.welcome p{margin:16px 0 0;font-size:clamp(17px,1.5vw,21px);color:#e6d9c3;text-shadow:0 1px 10px rgba(0,0,0,.55);animation:rise .7s .2s var(--ease) both}
.welcome i{display:block;width:80px;height:3px;border-radius:2px;background:var(--metal);margin-top:20px}
@keyframes rise{from{opacity:0;transform:translateY(-18px)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
.login main{flex:1 1 440px;display:grid;place-items:center;padding-block:44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.lform{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .6s .1s var(--ease) both}
.lform h1{font-size:clamp(34px,3.2vw,46px);font-weight:var(--dw);letter-spacing:-.02em}
.lform .lead{font-size:16px}
.lform .inp,.lform .pw{height:54px}
.lform .btn-p{min-height:56px;font-size:17px;background:linear-gradient(90deg,#efd395 0%,#d9b46a 60%,#c39a55 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(26,20,12,.16)}
.lform .btn-p:hover{background:linear-gradient(90deg,#efd395 0%,#d9b46a 60%,#c39a55 100%)}
.lform .fine{font-size:13.5px;line-height:1.55}
.pw{display:flex;align-items:center;height:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 6px 0 14px}
.pw:focus-within{border:2px solid var(--brand);box-shadow:0 0 0 4px var(--focus);padding-left:13px}
.pw input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0;height:100%}
.pw button{border:0;background:transparent;height:36px;padding:0 10px;border-radius:var(--r-s);font-weight:500;display:flex;gap:6px;align-items:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}

/* staff */
.staff{display:flex;min-height:100vh}
.rail{flex:none;width:92px;background:var(--rail);color:var(--rail-ink);padding:18px 8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.rail img{width:52px;height:52px;object-fit:contain;align-self:center;margin-bottom:12px}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border:0;border-radius:var(--r);background:transparent;color:var(--rail-ink);font-size:12px;min-height:56px}
.rail button svg{width:22px;height:22px;color:var(--rail-mute)}
.rail button:hover{background:var(--rail-2)}
.rail button[aria-current="page"]{background:var(--rail-2);color:var(--gold);font-weight:700}
.rail button[aria-current="page"] svg{color:var(--gold)}
.rail .badge{position:absolute;top:3px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:800;display:grid;place-items:center}
.rail .me{margin-top:auto;align-self:center;width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:13px;border:0}
.work{flex:1;min-width:0;padding:0 30px 40px;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px;animation:fadeUp .35s var(--ease) both}
.crumb{color:var(--ink2);font-size:14px}
.crumb button{border:0;background:none;padding:0;color:var(--link);font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:30px;font-weight:var(--dw);letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi b{font:var(--dw) 32px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi.dark{background:var(--brand);color:var(--on-brand);border-radius:var(--r-l)}
.kpi.dark .t{color:rgba(255,255,255,.75)}
.kpi.dark button{align-self:flex-start;border:0;background:none;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:18px}
.panel{padding:6px 8px 8px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 10px}
.panel h2{font-size:17px;font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--link);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 10px;border-radius:var(--r);width:100%;border:0;background:transparent;text-align:left}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .main b{font-weight:600}
.row .main span{font-size:13px;color:var(--ink2)}
.date{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;border-radius:var(--r-s);background:var(--sunk);padding:4px 0}
.date b{font-weight:800;font-size:17px;line-height:1.1}
.date span{font-size:11px;color:var(--ink2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plist li{display:flex;flex-wrap:wrap;gap:14px;align-items:center;min-height:64px;padding:12px 16px;animation:fadeUp .35s var(--ease) both}
.plist li .main{flex:1 1 240px;min-width:0}
.plist li .main span{font-size:13.5px;color:var(--ink2)}
.amt{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.strip{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding:14px 18px;border-radius:var(--r-l);background:var(--sunk)}
.strip span{display:inline-flex;gap:6px;align-items:center}
.strip svg{width:16px;height:16px}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split > *{min-width:0}
.voucher{flex:1 1 340px;padding:22px;display:flex;flex-direction:column;gap:14px}
.paper{background:#fff;color:#222;border-radius:var(--r);padding:22px;border:1px solid var(--hair);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);transform:rotate(-.6deg)}
.paper .bk{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f2c200;padding-bottom:10px;margin-bottom:12px;font-weight:800;color:#0b3d7a}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.paper dt{color:#666}.paper dd{margin:0;font-weight:600;text-align:right}
.checks{display:flex;flex-direction:column;gap:8px}
.checks div{display:flex;gap:10px;align-items:center;font-size:14px}
.checks svg{width:18px;height:18px;flex:none}
.notif{border-radius:var(--r);background:var(--sunk);padding:18px;font-size:14px}
.notif .nh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--hair)}
.notif .nh span{color:var(--ink2);font-size:13px}
.notif dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.notif dt{color:var(--ink2)}.notif dd{margin:0;font-weight:600;text-align:right}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:flex;gap:12px;align-items:flex-start;position:relative}
.tl li:not(:last-child)::after{content:"";position:absolute;left:11px;top:26px;bottom:-12px;width:2px;background:var(--ok-bg)}
.tl .dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.tl b{display:block;font-size:14.5px}
.tl div span{font-size:13px;color:var(--ink2)}
.tl .dot.wait{background:var(--info)}.tl .dot.bad{background:var(--bad)}.tl .dot.off{background:var(--sunk);color:var(--ink2)}.tl .dot.void{background:var(--void)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-s);font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.adm{background:var(--rail);color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:18px;align-items:start}
.grid3c{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px;align-items:start}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters .field{flex:1 1 170px}
.crow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--hair);padding:4px 0}
.crow:first-of-type{border-top:0}
.crow .main{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .main span{font-size:13px;color:var(--ink2)}
.switch{flex:none;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sunk);padding:14px 16px;border-radius:var(--r)}
.otp{font:600 26px/1 var(--display)!important;letter-spacing:.5em;text-align:center;height:60px!important;padding-left:.5em!important}
.mini{display:flex;flex-direction:column;gap:2px}
.mini b{font:var(--dw) 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.saldo b.big{font:var(--dw) 40px/1.05 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.saldo .bar{margin-top:6px}
.saldo .bar i.low{background:#f3a59d}
tfoot td{border-top:2px solid var(--ink);font-weight:700}
.side{flex:1 1 360px;padding:22px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.form-grid{flex:2 1 480px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.drop{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--sunk);cursor:pointer;font-weight:400}
.drop .ic{width:44px;height:44px;border-radius:var(--r);background:var(--surface);display:grid;place-items:center;flex:none}
.summary{flex:1 1 280px;padding:20px;border-radius:var(--r-l);background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:12px}
.summary .m{color:var(--rail-mute)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transform-origin:left;animation:grow .9s .1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:10px 14px}
td{padding:12px 14px;border-top:1px solid var(--hair);vertical-align:middle}
td.r,th.r{text-align:right}
.receipt{max-width:640px;width:100%;padding:28px;display:flex;flex-direction:column;gap:18px}
.receipt .top{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:16px}
.receipt .top img{width:64px;height:64px;object-fit:contain}
.verif{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--ok-bg);color:var(--ok)}
.qr{flex:none;width:76px;height:76px;background:#fff;border-radius:6px;padding:6px;display:grid;grid-template-columns:repeat(9,1fr);gap:1px}
.qr i{background:#111;border-radius:1px}.qr i.o{background:transparent}
.verify-box{display:flex;gap:10px;flex-wrap:wrap}
.verify-box .inp{flex:1 1 220px}

/* insured / phone */
.mwrap{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide{flex:0 1 320px;display:flex;flex-direction:column;gap:14px;padding-top:24px}
.guide h2{font-size:24px;font-weight:var(--dw)}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.guide li::marker{font-weight:700;color:var(--link)}
.guide .note{padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:14px}
.phone{position:relative;width:390px;max-width:100%;height:844px;max-height:calc(100vh - 110px);min-height:640px;border-radius:52px;border:11px solid var(--device);background:var(--bg);overflow:hidden;box-shadow:var(--shadow-lg);flex:none}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:var(--device);z-index:30}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr.fwd{animation:pushIn .28s var(--ease)}
.scr.back{animation:popIn .28s var(--ease)}
@keyframes pushIn{from{transform:translateX(60%);opacity:.2}}
@keyframes popIn{from{transform:translateX(-30%);opacity:.2}}
.mtop{display:flex;align-items:center;gap:10px;padding:50px 16px 8px 20px}
.mtop h1{flex:1;font-size:22px;font-weight:700}
.mtop.sub{padding-left:8px}
.ibtn{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.ibtn svg{width:21px;height:21px}
.ibtn.plain{background:transparent;box-shadow:none}
.ibtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.mbody{flex:1;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.mbody::-webkit-scrollbar{display:none}
.hero{padding:18px;border-radius:var(--r-l);background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:6px;animation:fadeUp .4s var(--ease) both}
.hero .m{color:var(--rail-mute);font-size:14px}
.hero b.big{font:var(--dw) 36px/1.1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.hero .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hero .acts button{height:48px;border-radius:var(--r);font-weight:700;font-size:15px}
.hero .gold{border:0;background:var(--gold);color:var(--on-gold)}
.hero .line{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--rail-ink);font-weight:600}
.note-m{display:flex;gap:10px;padding:14px 16px;border-radius:var(--r-l);animation:fadeUp .4s var(--ease) both}
.note-m svg{flex:none;width:20px;height:20px}
.note-m b{display:block}
.note-m span{font-size:14px}
.note-m button{border:0;background:none;padding:0;margin-top:6px;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px}
.pol{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 12px;border:0;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);min-height:68px}
.pol .ic{width:44px;height:44px;border-radius:var(--r);background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--link)}
.pol .ic svg{width:22px;height:22px}
.pol .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pol .main span{font-size:14px;color:var(--ink2)}
.pol .chev{width:20px;height:20px;color:var(--ink2);flex:none}
.h2m{font-size:18px;font-weight:700;margin-top:4px}
.mnav{position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:78px;padding-bottom:16px;background:var(--surface);box-shadow:0 -2px 14px rgba(0,0,0,.06);flex:none}
.mnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink2)}
.mnav button svg{width:22px;height:22px}
.mnav button[aria-current="page"]{color:var(--link);font-weight:700}
.mfoot{padding:12px 16px 26px;background:var(--surface);box-shadow:0 -2px 14px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px;flex:none}
.mfoot .tot{display:flex;justify-content:space-between;align-items:baseline}
.mfoot .tot b{font:var(--dw) 24px var(--display);font-variant-numeric:tabular-nums}
.cuota{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);min-height:60px}
label.cuota{cursor:pointer}
.cuota input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.cuota .main{flex:1;display:flex;flex-direction:column}
.cuota .main span{font-size:13.5px;color:var(--ink2)}
.cuota.sel{box-shadow:inset 0 0 0 2px var(--brand),var(--shadow)}
.sumbox{padding:16px;display:flex;flex-direction:column;gap:10px}
.prog{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;border-radius:5px;background:var(--brand);transform-origin:left;animation:grow .9s .1s var(--ease) both}
.overlay{position:absolute;inset:0;z-index:40;background:rgba(20,16,12,.55);display:grid;place-items:center;animation:fade .2s ease}
.overlay .box{background:var(--surface);border-radius:var(--r-l);padding:26px 24px;width:260px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:fadeUp .3s var(--ease)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--sunk);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.done svg.big{width:112px;height:112px}
.done .ring{stroke-dasharray:302;stroke-dashoffset:302;animation:draw .7s .1s var(--ease) forwards}
.done .tick{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .65s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h1{font-size:26px;font-weight:var(--dw)}
.done .amt-big{font:var(--dw) 40px var(--display);font-variant-numeric:tabular-nums}
.burst{animation:burst .6s .55s var(--ease) both}
@keyframes burst{from{transform:scale(.6);opacity:0}}
.mrec{padding:18px;display:flex;flex-direction:column;gap:12px}
.mrec .kv{font-size:14.5px}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);width:100%;border:0;text-align:left;min-height:64px}
.listrow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.listrow .main span{font-size:13.5px;color:var(--ink2)}

/* Claroscuro accents: metallic gold actions, gold-lit dark panels */
.btn-p,
.hero .gold{background:var(--metal);color:var(--on-gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(26,20,12,.16)}
.btn-p:hover{background:var(--metal);filter:brightness(1.06)}
.btn-p[style*="--bad"]{background:var(--bad)!important;color:#fff;box-shadow:none}
.kpi.dark,
.hero,
.summary{background:var(--glow),var(--rail);color:var(--rail-ink);box-shadow:inset 0 0 0 1px rgba(226,191,125,.25),0 10px 28px rgba(30,30,30,.18)}
.kpi.dark b{color:var(--gold)}
.kpi.dark .t{color:var(--rail-mute)}
.prog i{background:var(--metal)}
.mnav,
.mfoot{box-shadow:inset 0 1px 0 var(--hair)}
/* ===== v2 · unión con el sistema anterior ===== */
.rail{overflow-y:auto;scrollbar-width:none;padding-bottom:18px}
.rail::-webkit-scrollbar{display:none}
.toasts{z-index:130}
.muted{color:var(--ink2)}
.grow{flex:1}

/* barra superior del personal: buscador global, avisos y menú de usuario */
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:14px 0 12px;background:var(--bg)}
.gs{position:relative;flex:1;max-width:480px}
.gs>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2);pointer-events:none}
.gs input{width:100%;height:44px;padding:0 44px 0 42px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:16px}
.gs input:focus{outline:0;border:2px solid var(--brand);box-shadow:0 0 0 4px var(--focus);padding-left:41px}
.gs kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 12px var(--body);color:var(--ink2);background:var(--sunk);border-radius:5px;padding:2px 7px;pointer-events:none}
.tbr{margin-left:auto;display:flex;align-items:center;gap:8px}
.anc{position:relative}
.usr{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 10px 4px 4px;border-radius:999px;min-height:48px;text-align:left;transition:background-color .2s,transform .15s var(--ease)}
.usr:hover{background:var(--sunk)}
.usr:active{transform:scale(.97)}
.usr .nm b{display:block;font-size:14px;line-height:1.2}
.usr .nm span{font-size:12.5px;color:var(--ink2)}
.usr>svg{color:var(--ink2)}
.av.adm{background:var(--rail);color:var(--gold);box-shadow:none}
.pop{position:absolute;top:calc(100% + 8px);right:0;z-index:45;width:min(360px,calc(100vw - 32px));background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;transform-origin:top right;animation:sc .2s var(--ease) both}
.gs .pop{left:0;right:auto;width:100%;min-width:min(340px,calc(100vw - 32px));transform-origin:top left;max-height:min(70vh,460px);overflow-y:auto}
@keyframes sc{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.pop .pt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:10px 10px 4px}
.pi{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:8px 10px;border:0;background:transparent;border-radius:8px;text-align:left;transition:background-color .15s}
.pi:hover,.pi[aria-selected="true"]{background:var(--sunk)}
.pi .bx{flex:none;width:36px;height:36px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--link)}
.pi .bx svg{width:18px;height:18px}
.pi .mn{flex:1;min-width:0;display:flex;flex-direction:column}
.pi .mn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .mn span{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi.bad{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--hair);margin:6px 0}
.pop .me{padding:10px;display:flex;flex-direction:column;gap:2px}
.pop .me span{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.wfoot{margin-top:auto;padding-top:18px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:13px;color:var(--ink2)}

/* cifras que filtran */
.kpi.f{border:0;font:inherit;text-align:left;cursor:pointer;position:relative;color:inherit;animation:fadeUp .4s var(--ease) both;transition:transform .25s var(--ease),box-shadow .25s}
.kpi.f:hover{transform:translateY(-2px)}
.kpi.f:active{transform:scale(.98)}
.kpi.f .t{font-size:14px;font-weight:500;color:var(--ink2)}
.kpi.f .s{font-size:13px;color:var(--ink2)}
.kpi.dark.f .t,.kpi.dark.f .s{color:var(--rail-mute)}
.kpi.f .ck{position:absolute;top:14px;right:14px;width:20px;height:20px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s var(--ease)}
.kpi.f[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.kpi.f[aria-pressed="true"] .ck{opacity:1;transform:none}
.kpi.dark.f[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold),0 10px 28px rgba(30,30,30,.18)}
.kpi.dark.f .ck{color:var(--gold)}

/* lista: barra, filas con identidad, íconos de ramo apilados */
.lc{overflow:hidden}
.lt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--hair)}
.lt .cnt{font-weight:600}
.lt label.sel{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.lt select{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:15px;max-width:200px}
.ls{position:relative;flex:1 1 220px;max-width:340px}
.ls>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink2);pointer-events:none}
.ls input{width:100%;height:40px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:15px}
.ls input:focus{outline:0;border:2px solid var(--brand);box-shadow:0 0 0 4px var(--focus);padding-left:37px}
.dt{width:100%;border-collapse:collapse;font-size:15px}
.dt th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:12px 14px;white-space:nowrap}
.dt td{padding:10px 14px;border-top:1px solid var(--hair);vertical-align:middle;height:64px}
.dt th:first-child,.dt td:first-child{padding-left:18px}
.dt th:last-child,.dt td:last-child{padding-right:18px}
.dt .r{text-align:right}
.dt tbody tr{cursor:pointer;transition:background-color .18s;animation:fadeUp .35s var(--ease) both}
.dt.noanim tbody tr{animation:none}
.dt tbody tr:hover{background:var(--bg)}
.pr{font-weight:700;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .t{display:flex;flex-direction:column;min-width:0}
.who .t b,.who .t button{all:unset;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .t b{cursor:inherit}
.who .t button:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
.who .t span{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av.soc{border-radius:8px}
.mail{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:14px}
.mail svg{width:16px;height:16px;flex:none}
.stk{display:flex;align-items:center;gap:10px}
.cntbox{min-width:26px;height:26px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px}
.ico{display:flex}
.ico span{width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--link);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface),inset 0 0 0 1px #d9d6d1}
.ico span+span{margin-left:-8px}
.ico svg{width:15px;height:15px}
.ico .more{font-size:11px;font-weight:700;color:var(--ink2)}
.ramo{display:inline-flex;gap:8px;align-items:center}
.ramo svg{width:16px;height:16px;color:var(--link);flex:none}
.plazo{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap}
.plazo svg{width:13px;height:13px;flex:none}
.plazo.bad{color:var(--bad);font-weight:600}
.plazo.warn{color:var(--warn);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill.live svg{animation:breath 2s ease-in-out infinite}
@keyframes breath{50%{opacity:.35}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink2)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.empty{padding:44px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:32px;height:32px;color:var(--ink2)}
.empty b{font-weight:600}
.empty span{color:var(--ink2);font-size:14px}
.leg{border-top:1px solid var(--hair);background:var(--sunk)}
.leg summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;color:var(--link);font-weight:600;cursor:pointer}
.leg summary::-webkit-details-marker{display:none}
.leg summary svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.leg[open] summary svg{transform:rotate(180deg)}
.leg .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px 24px;padding:6px 18px 18px;font-size:14px;color:var(--ink2)}
.leg .g div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}

/* hoja lateral y diálogo (globales) */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(20,16,12,.5);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(560px,100%);background:var(--bg);border-radius:16px 0 0 16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
body.sh-open .scrim{opacity:1;visibility:visible;transition:opacity .3s var(--ease),visibility 0s}
body.sh-open .sheet{transform:none;visibility:visible;transition:transform .3s var(--ease),visibility 0s}
.shead{position:relative;padding:26px 64px 22px 24px;background:var(--glow),var(--rail);color:var(--rail-ink);border-radius:16px 0 0 0;display:flex;gap:16px;align-items:center;flex:none;padding-top:max(26px,calc(env(safe-area-inset-top,0px) + 16px))}
.shead .av{width:64px;height:64px;font-size:20px;background:var(--gold);color:var(--on-gold);box-shadow:none}
.shead h2{font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.shead .m{color:var(--rail-mute);font-size:14px;margin-top:4px}
.shead .x{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--rail-ink);display:grid;place-items:center}
.shead .x:hover{background:var(--rail-2)}
.sbody{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:24px}
.sbody h3{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:baseline;margin:0 0 10px}
.sbody h3 small{font:500 14px var(--body);color:var(--ink2)}
.sfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:inset 0 1px 0 var(--hair);flex:none}
.ct{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:8px;min-height:56px;width:100%;border:0;text-align:left}
.ct .bx{flex:none;width:36px;height:36px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--link)}
.ct .bx svg{width:18px;height:18px}
.ct .mn{flex:1;min-width:0;display:flex;flex-direction:column}
.ct .mn span{font-size:13px;color:var(--ink2)}
.ct .mn b{font-weight:600;overflow-wrap:anywhere}
.ct .ch{width:18px;height:18px;color:var(--ink2);flex:none}
button.ct{transition:transform .15s var(--ease),background-color .15s}
button.ct:hover{background:var(--bg)}
button.ct:active{transform:scale(.985)}
.back{border:0;background:none;padding:0;min-height:32px;color:var(--link);font-weight:600;display:inline-flex;gap:4px;align-items:center;align-self:flex-start}
.back svg{width:16px;height:16px}
.sum{padding:18px;border-radius:12px;background:var(--glow),var(--rail);color:var(--rail-ink);box-shadow:inset 0 0 0 1px rgba(226,191,125,.25),0 10px 28px rgba(30,30,30,.18);display:flex;flex-direction:column;gap:12px}
.sum .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sum small{display:block;color:var(--rail-mute);font-size:13px}
.sum b{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.sum b.g{color:var(--gold)}
.hc{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow)}
.hc b{font-family:var(--display)}
.hc div{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.hc div svg{flex:none;width:16px;height:16px;margin-top:2px}
.hc .a svg{color:var(--info)}.hc .b svg{color:var(--ok)}.hc .c svg{color:var(--void)}
.dlgw{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(20,16,12,.5);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.dlgw.on{opacity:1;visibility:visible;transition:opacity .2s}
.dlg{width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;transform:scale(.96);transition:transform .25s var(--ease)}
.dlgw.on .dlg{transform:none}
.dlg h2{font-size:22px;font-weight:700}
.dlg .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px;margin-top:18px}
.dlg .fg .full{grid-column:1/-1}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}
.dlg .prev{padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:14.5px}
.chip2{display:inline-flex}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dias button{min-width:48px;height:44px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);font-weight:600;transition:transform .15s var(--ease)}
.dias button:active{transform:scale(.96)}
.dias button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--hair);min-height:52px}
.srow:first-of-type{border-top:0}
.srow .mn{display:flex;flex-direction:column;min-width:0}
.srow .mn span{font-size:13px;color:var(--ink2)}
.legal{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13.5px}
.legal a{font-weight:600}

@media (max-width:980px){.hide-m{display:none}}
@media (max-width:760px){
  .topbar{position:static;padding-top:12px}
  .usr .nm,.usr>svg,.gs kbd{display:none}

  .sheet{border-radius:0}
  .shead{border-radius:0}

}
html,body{overflow-x:clip}
.reglas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink2)}
.reglas li{display:flex;gap:8px;align-items:center}
.reglas li svg{width:15px;height:15px;flex:none}
.reglas li.ok{color:var(--ok)}
.cuentas{border-top:1px solid var(--hair);padding-top:6px}
.cuentas summary{cursor:pointer;color:var(--link);font-weight:600;min-height:44px;display:flex;align-items:center}
.cuentas .cl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.lform h1{line-height:1.1}

.pager{flex-wrap:wrap}
.pgn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pgb{min-width:40px;height:40px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--ink);transition:transform .15s var(--ease),background-color .15s}
.pgb.w{padding:0 14px}
.pgb:hover:not(:disabled):not([aria-current]){background:var(--sunk)}
.pgb:active:not(:disabled){transform:scale(.96)}
.pgb[aria-current="page"]{background:var(--brand);color:var(--on-brand);box-shadow:none}
.pgb:disabled{opacity:.45;cursor:not-allowed}
.pgx{display:grid;place-items:center;min-width:24px;color:var(--ink2)}
.qf{display:grid;grid-template-columns:1.5fr 1.3fr 1fr 1fr auto;gap:12px;align-items:start}
.qf .btn{margin-top:26px}
@media (max-width:1100px){.qf{grid-template-columns:1fr 1fr}.qf .btn{margin-top:0;grid-column:1/-1}}
@media (max-width:560px){.qf{grid-template-columns:1fr}}
/* ventana modal centrada (antes hoja lateral) */
.sheet{top:50%;left:50%;right:auto;bottom:auto;width:min(680px,calc(100% - 32px));height:auto;max-height:calc(100dvh - 48px);border-radius:16px;overflow:hidden;opacity:0;transform:translate(-50%,-47%) scale(.96);transition:transform .25s var(--ease),opacity .2s,visibility 0s .25s}
body.sh-open .sheet{opacity:1;transform:translate(-50%,-50%);transition:transform .25s var(--ease),opacity .2s,visibility 0s}
.sheet .shead{border-radius:16px 16px 0 0;padding-top:26px}
.sheet .shead .x{top:12px}
.sheet .sbody{min-height:0}

/* búsqueda global */
function buscar(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const out=[],has=s=>String(s).toLowerCase().includes(q);
  const cl=CLIENTES().filter(c=>has(c.n)||has(c.idn)||has(c.mail)).slice(0,4).map(c=>({g:'Clientes',k:'cli:'+c.n,i:'users',t:c.n,s:c.idn+' · '+polsOf(c.n).length+' pólizas'}));
  const po=PM().filter(p=>has(p.num)||has(p.cli)).slice(0,4).map(p=>({g:'Pólizas',k:'pol:'+p.num,i:RAMO[p.ramo][0],t:p.num,s:p.cli+' · '+RAMO[p.ramo][1]}));
  const re=D.pays.filter(p=>p.rec&&(has(p.rec)||has(p.cli))).slice(0,4).map(p=>({g:'Recibos',k:'rec:'+p.rec,i:'rec',t:p.rec,s:p.cli+' · '+fmt(p.monto)}));
  return cl.concat(po,re);
}
function renderBusqueda(q){
  const w=$('#gsw');if(!w)return;let pop=w.querySelector('.pop');
  if(!q.trim()){if(pop)pop.remove();$('#gq').setAttribute('aria-expanded','false');return}
  if(!pop){pop=document.createElement('div');pop.className='pop';pop.id='srp';pop.setAttribute('role','listbox');w.appendChild(pop)}
  const r=buscar(q);let g='';
  pop.innerHTML=r.length?r.map((x,i)=>{const h=x.g!==g?`<div class="pt">${x.g}</div>`:'';g=x.g;return h+`<button class="pi" type="button" role="option" aria-selected="${i===0}" data-sr="${esc(x.k)}"><span class="bx">${ic(x.i,18)}</span><span class="mn"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></span></button>`}).join(''):`<div class="empty" style="padding:22px 12px"><b>Sin resultados para «${esc(q.trim())}»</b><span>Pruebe con un nombre, una identificación o un código.</span></div>`;
  $('#gq').setAttribute('aria-expanded','true');
}
function abrirResultado(k){
  closePops();const g=$('#gq');if(g)g.value='';
  if(k.indexOf('rec:')===0){go('recibo',k.slice(4))}else openSheet(k);
}

function cedulaOk(c){if(!/^\d{10}$/.test(c))return false;const pv=+c.slice(0,2);if(pv<1||(pv>24&&pv!==30))return false;if(+c[2]>5)return false;let s=0;for(let i=0;i<9;i++){let v=+c[i]*(i%2===0?2:1);if(v>9)v-=9;s+=v}return (10-s%10)%10===+c[9]}

const claveReglas=v=>[[v.length>=12,'Al menos 12 caracteres'],[/[a-z]/.test(v)&&/[A-Z]/.test(v),'Una mayúscula y una minúscula'],[/\d/.test(v),'Un número']];

function campoClave(id,label,hint){return `<label class="field" for="${id}">${label}<span class="pw"><input id="${id}" type="password" autocomplete="${id.endsWith('A')?'current-password':'new-password'}"></span>${hint||''}<span class="err" id="${id}E" role="alert" hidden></span></label>`}
function setErrC(id,msg){const e=$('#'+id+'E'),i=$('#'+id);if(!e)return;e.hidden=!msg;e.textContent=msg||'';if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid')}
function validarClave(p,a,n,r){
  const err={};
  if(a!==CUENTAS[miCorreo()].p)err.A='La contraseña actual no es correcta.';
  if(!claveReglas(n).every(x=>x[0]))err.N='La contraseña nueva no cumple los requisitos de abajo.';
  else if(n===a)err.N='Elija una contraseña distinta de la actual.';
  if(!err.N&&n!==r)err.R='Las contraseñas no coinciden.';
  if(!r&&!err.R&&!err.N)err.R='Repita la contraseña nueva.';
  ['A','N','R'].forEach(k=>setErrC(p+k,err[k]));
  const f=['A','N','R'].find(k=>err[k]);if(f)$('#'+p+f).focus();
  return !f;
}

    UI.rej={open:false,chip:null};toast(`Pago rechazado. Avisamos a ${esc(p.cli.split(' ')[0])} con el motivo.`);UI.tab='por';go('pagos');return}
  if(d.remind){const c=D.cartera.find(x=>x.id===d.remind);c.rem=true;toast(`Recordatorio enviado a ${esc(c.cli)}.`);render();return}
  if('remindall' in d){D.cartera.forEach(c=>c.rem=true);toast(`Recordatorios enviados a ${D.cartera.length} clientes.`);render();return}
  if(d.mail){toast(`Recibo ${d.mail} enviado por correo.`);return}
  if(d.mmail){toast('Enviamos el recibo a mf.guaman@correo.ec.');return}
  if('mback' in d){mBack();return}
  if(d.mtab){if(d.mtab==='verificar')UI.verify=null;mTab(d.mtab);return}
  if(d.mgo){if(d.mgo==='verificar')UI.verify=null;if(d.mgo==='reportar')UI.rep={};mGo(d.mgo,d.mp);return}
});

/* ---------- render ---------- */
function render(){
  const app=$('#app');_P=null;
  if(UI.role==='login'){app.innerHTML=vLogin();bindLogin()}
  else if(UI.role==='staff'){app.innerHTML=vStaff();bindStaff();bindShell()}
  else{app.innerHTML=vClient();bindClient();UI.m.dir=null}
}
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
function resetDatos(){D=seed();UI.verify=null;UI.carga={step:'form',aseg:'Sweaden',ids:[]};UI.tab='por';toast('Datos de ejemplo restablecidos.');setRole(UI.role==='staff'?(UI.who==='admin'?'admin':'staff'):UI.role)}
document.documentElement.lang='es-EC';
render();
})();
</script>
