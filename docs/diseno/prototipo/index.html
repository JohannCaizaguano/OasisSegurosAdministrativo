<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SRPP Oasis Seguros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: slim prototype bar on top; login = photo with centered welcome + form; staff = icon rail + workspace; insured = phone frame beside a test guide.
   Palette: Claroscuro (black and gold), set explicitly so it ignores the host theme. Tokens mirror apps/web/DESIGN.md. */
:root{
  --bg:#f6f4f0; --surface:#ffffff; --sunk:#efebe4; --ink:#1a1714; --ink2:#5e564b; --line:#8c8478; --hair:#e9e4db;
  --brand:#1a1714; --brand-hover:#33302b; --on-brand:#ffffff; --link:#8a6122;
  --rail:#14110d; --rail-2:#26201a; --rail-ink:#f3ece0; --rail-mute:#a59985; --gold:#f0c878; --on-gold:#1a140c;
  --focus:rgba(226,173,91,.38); --shadow:0 0 0 1px #ebe6dd,0 4px 16px rgba(26,23,20,.05); --shadow-lg:0 24px 60px rgba(20,17,13,.28);
  --r-s:6px; --r:8px; --r-l:12px; --r-xl:16px;
  --display:'Outfit',system-ui,sans-serif; --dw:700; --body:'Figtree',system-ui,sans-serif;
  --ok:#2f6b3a; --ok-bg:#eaf4e4; --info:#2b5c87; --info-bg:#e6f0f7; --warn:#8c4f0a; --warn-bg:#fcefd9; --bad:#a2332b; --bad-bg:#fbe8e4; --void:#5e564b; --void-bg:#efebe4;
  --bar:#0f0d0a; --bar-ink:#f3ece0; --bar-mute:#a59985; --device:#0d0b09;
  --metal:linear-gradient(135deg,#f6d592 0%,#e2ad5b 55%,#c98f3e 100%);
  --glow:radial-gradient(120% 130% at 0% 0%,rgba(240,200,120,.22),rgba(240,200,120,0) 60%);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);caret-color:var(--ink);accent-color:var(--brand);scrollbar-color:var(--rail-mute) transparent}
::selection{background:var(--gold);color:var(--on-gold)}
a{text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rail :focus-visible,.pbar :focus-visible,.hero :focus-visible,.summary :focus-visible,.kpi.dark :focus-visible,.toast :focus-visible{outline-color:var(--gold)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* prototype bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--bar-ink);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
.pbar b{font-weight:700;letter-spacing:.02em}
.pbar .lbl{color:var(--bar-mute);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--bar-ink);height:30px;padding:0 13px;border-radius:999px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.pbar .grow{flex:1}
.pbar .ghost{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--bar-ink);height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
.grp{display:inline-flex;gap:8px;align-items:center}

/* common controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:var(--r);font-weight:600;font-size:15px;text-decoration:none;transition:transform .15s var(--ease),background-color .2s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-p:hover{background:var(--brand-hover)}
.btn-s{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn-q{background:var(--sunk);color:var(--ink)}
.btn-bad{background:var(--surface);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn-lg{min-height:52px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field .hint{font-weight:400;font-size:13px;color:var(--ink2)}
.field .err{font-weight:500;font-size:13px;color:var(--bad)}
.inp{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:400;font-size:16px;width:100%;min-width:0}
textarea.inp{height:auto;padding:12px 14px;resize:vertical}
.inp:focus{outline:0;border:2px solid var(--brand);box-shadow:0 0 0 4px var(--focus);padding-left:13px}
.inp[aria-invalid="true"]{border:2px solid var(--bad)}
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 11px 4px 8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-info{background:var(--info-bg);color:var(--info)} .s-warn{background:var(--warn-bg);color:var(--warn)} .s-bad{background:var(--bad-bg);color:var(--bad)} .s-void{background:var(--void-bg);color:var(--void)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--void-bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.muted{color:var(--ink2)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);line-height:1.45}
.alert svg{flex:none;width:20px;height:20px;margin-top:1px}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;padding:13px 16px;border-radius:var(--r);background:var(--bar);color:var(--bar-ink);box-shadow:var(--shadow-lg);animation:toastIn .35s var(--ease)}
.toast svg{flex:none;width:20px;height:20px;color:var(--gold)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* login */
.login{display:flex;flex-wrap:wrap;min-height:calc(100vh - 48px)}
.login .photo{flex:1 1 480px;position:relative;min-height:560px;background:#14110d url(oasis.jpg) center/cover;display:flex;flex-direction:column;align-items:center;padding:clamp(48px,10vh,120px) 24px 64px;overflow:hidden;text-align:center}
.login .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,10,.7) 0%,rgba(15,13,10,.38) 42%,rgba(15,13,10,.12) 68%,rgba(15,13,10,.4) 100%)}
.welcome{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:680px;isolation:isolate}
.welcome::before{content:"";position:absolute;z-index:-1;left:-12%;right:-12%;top:38%;bottom:-28%;background:radial-gradient(closest-side,rgba(15,13,10,.72),rgba(15,13,10,.45) 60%,rgba(15,13,10,0));pointer-events:none}
.welcome img{width:clamp(150px,17vw,236px);height:auto;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5));animation:pop .8s .15s var(--ease) both}
.welcome h2{margin-top:clamp(28px,5vh,56px);font:var(--dw) clamp(30px,3.4vw,48px)/1.1 var(--display);letter-spacing:-.015em;color:#f6efe2;text-shadow:0 2px 18px rgba(0,0,0,.45);animation:rise .7s .1s var(--ease) both}
.welcome p{margin:16px 0 0;font-size:clamp(17px,1.5vw,21px);color:#e6d9c3;text-shadow:0 1px 10px rgba(0,0,0,.55);animation:rise .7s .2s var(--ease) both}
.welcome i{display:block;width:80px;height:3px;border-radius:2px;background:var(--metal);margin-top:20px}
@keyframes rise{from{opacity:0;transform:translateY(-18px)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
.login main{flex:1 1 440px;display:grid;place-items:center;padding-block:44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.lform{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .6s .1s var(--ease) both}
.lform h1{font-size:clamp(34px,3.2vw,46px);font-weight:var(--dw);letter-spacing:-.02em}
.lform .lead{font-size:16px}
.lform .inp,.lform .pw{height:54px}
.lform .btn-p{min-height:56px;font-size:17px;background:linear-gradient(90deg,#f6d592 0%,#e2ad5b 60%,#c98f3e 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(26,20,12,.16)}
.lform .btn-p:hover{background:linear-gradient(90deg,#f6d592 0%,#e2ad5b 60%,#c98f3e 100%)}
.lform .fine{font-size:13.5px;line-height:1.55}
.pw{display:flex;align-items:center;height:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 6px 0 14px}
.pw:focus-within{border:2px solid var(--brand);box-shadow:0 0 0 4px var(--focus);padding-left:13px}
.pw input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0;height:100%}
.pw button{border:0;background:transparent;height:36px;padding:0 10px;border-radius:var(--r-s);font-weight:500;display:flex;gap:6px;align-items:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}

/* staff */
.staff{display:flex;min-height:calc(100vh - 48px)}
.rail{flex:none;width:92px;background:var(--rail);color:var(--rail-ink);padding:18px 8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:48px;height:calc(100vh - 48px)}
.rail img{width:52px;height:52px;object-fit:contain;align-self:center;margin-bottom:12px}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border:0;border-radius:var(--r);background:transparent;color:var(--rail-ink);font-size:12px;min-height:56px}
.rail button svg{width:22px;height:22px;color:var(--rail-mute)}
.rail button:hover{background:var(--rail-2)}
.rail button[aria-current="page"]{background:var(--rail-2);color:var(--gold);font-weight:700}
.rail button[aria-current="page"] svg{color:var(--gold)}
.rail .badge{position:absolute;top:3px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:800;display:grid;place-items:center}
.rail .me{margin-top:auto;align-self:center;width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:13px;border:0}
.work{flex:1;min-width:0;padding:22px 30px 40px;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px;animation:fadeUp .35s var(--ease) both}
.crumb{color:var(--ink2);font-size:14px}
.crumb button{border:0;background:none;padding:0;color:var(--link);font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:30px;font-weight:var(--dw);letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi b{font:var(--dw) 32px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi.dark{background:var(--brand);color:var(--on-brand);border-radius:var(--r-l)}
.kpi.dark .t{color:rgba(255,255,255,.75)}
.kpi.dark button{align-self:flex-start;border:0;background:none;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:18px}
.panel{padding:6px 8px 8px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 10px}
.panel h2{font-size:17px;font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--link);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 10px;border-radius:var(--r);width:100%;border:0;background:transparent;text-align:left}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .main b{font-weight:600}
.row .main span{font-size:13px;color:var(--ink2)}
.date{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;border-radius:var(--r-s);background:var(--sunk);padding:4px 0}
.date b{font-weight:800;font-size:17px;line-height:1.1}
.date span{font-size:11px;color:var(--ink2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plist li{display:flex;flex-wrap:wrap;gap:14px;align-items:center;min-height:64px;padding:12px 16px;animation:fadeUp .35s var(--ease) both}
.plist li .main{flex:1 1 240px;min-width:0}
.plist li .main span{font-size:13.5px;color:var(--ink2)}
.amt{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.strip{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding:14px 18px;border-radius:var(--r-l);background:var(--sunk)}
.strip span{display:inline-flex;gap:6px;align-items:center}
.strip svg{width:16px;height:16px}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split > *{min-width:0}
.voucher{flex:1 1 340px;padding:22px;display:flex;flex-direction:column;gap:14px}
.paper{background:#fff;color:#222;border-radius:var(--r);padding:22px;border:1px solid var(--hair);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);transform:rotate(-.6deg)}
.paper .bk{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f2c200;padding-bottom:10px;margin-bottom:12px;font-weight:800;color:#0b3d7a}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.paper dt{color:#666}.paper dd{margin:0;font-weight:600;text-align:right}
.checks{display:flex;flex-direction:column;gap:8px}
.checks div{display:flex;gap:10px;align-items:center;font-size:14px}
.checks svg{width:18px;height:18px;flex:none}
.notif{border-radius:var(--r);background:var(--sunk);padding:18px;font-size:14px}
.notif .nh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--hair)}
.notif .nh span{color:var(--ink2);font-size:13px}
.notif dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.notif dt{color:var(--ink2)}.notif dd{margin:0;font-weight:600;text-align:right}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:flex;gap:12px;align-items:flex-start;position:relative}
.tl li:not(:last-child)::after{content:"";position:absolute;left:11px;top:26px;bottom:-12px;width:2px;background:var(--ok-bg)}
.tl .dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.tl b{display:block;font-size:14.5px}
.tl div span{font-size:13px;color:var(--ink2)}
.tl .dot.wait{background:var(--info)}.tl .dot.bad{background:var(--bad)}.tl .dot.off{background:var(--sunk);color:var(--ink2)}.tl .dot.void{background:var(--void)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-s);font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.adm{background:var(--rail);color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:18px;align-items:start}
.grid3c{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px;align-items:start}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters .field{flex:1 1 170px}
.crow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--hair);padding:4px 0}
.crow:first-of-type{border-top:0}
.crow .main{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .main span{font-size:13px;color:var(--ink2)}
.switch{flex:none;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sunk);padding:14px 16px;border-radius:var(--r)}
.otp{font:600 26px/1 var(--display)!important;letter-spacing:.5em;text-align:center;height:60px!important;padding-left:.5em!important}
.mini{display:flex;flex-direction:column;gap:2px}
.mini b{font:var(--dw) 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.saldo b.big{font:var(--dw) 40px/1.05 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.saldo .bar{margin-top:6px}
.saldo .bar i.low{background:#f3a59d}
tfoot td{border-top:2px solid var(--ink);font-weight:700}
.side{flex:1 1 360px;padding:22px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.form-grid{flex:2 1 480px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.drop{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--sunk);cursor:pointer;font-weight:400}
.drop .ic{width:44px;height:44px;border-radius:var(--r);background:var(--surface);display:grid;place-items:center;flex:none}
.summary{flex:1 1 280px;padding:20px;border-radius:var(--r-l);background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:12px}
.summary .m{color:var(--rail-mute)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transform-origin:left;animation:grow .9s .1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:10px 14px}
td{padding:12px 14px;border-top:1px solid var(--hair);vertical-align:middle}
td.r,th.r{text-align:right}
.receipt{max-width:640px;width:100%;padding:28px;display:flex;flex-direction:column;gap:18px}
.receipt .top{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:16px}
.receipt .top img{width:64px;height:64px;object-fit:contain}

function verifRes(p){

  if(p.anc==='proc'||p.anc==='fall')return `<div class="alert s-info" style="animation:fadeUp .3s var(--ease)">${ic('clock',20,2)}<span><b>En proceso.</b> El recibo ${p.rec} existe y todavía se está registrando en la red. Vuelva a verificarlo en unos minutos.</span></div>`;
  return `<div class="verif" style="animation:fadeUp .3s var(--ease)">${ic('shield',28,2)}<div><b>Recibo auténtico</b><br><span style="font-size:14px">${p.rec} · ${esc(p.cli)} · ${fmt(p.monto)} · ${p.fecha}</span></div></div>`}

  return `<form class="verify-box" id="${id}"><label class="sr" for="${id}-in">Código del recibo</label><input class="inp" id="${id}-in" placeholder="Ej. OAS-2026-000212" value="${esc(r||'')}"><button class="btn btn-p" type="submit">Verificar</button></form>${res}`;

function receiptDoc(p,compact){
  return `<div class="top"><img src="logo.png" alt="Oasis Seguros"><div style="text-align:right"><span class="muted" style="font-size:13px">Recibo de pago</span><br><b style="font:var(--dw) ${compact?19:22}px var(--display)">${p.rec}</b></div></div>

  <dl class="kv"><dt>Cliente</dt><dd>${esc(p.cli)}</dd><dt>Póliza</dt><dd>${p.code}</dd><dt>Cuota</dt><dd>${p.cuotas.join(', ')}</dd><dt>Fecha de pago</dt><dd>${p.fecha}</dd><dt>Método</dt><dd>${esc(p.metodo)}</dd><dt>Estado</dt><dd>${p.anc==='anul'?'Anulado':'Validado'}</dd></dl>
  <div class="verif" ${p.anc==='anul'?'style="background:var(--void-bg);color:var(--void)"':p.anc==='proc'||p.anc==='fall'?'style="background:var(--info-bg);color:var(--info)"':''}>${qr(p.rec)}<div style="min-width:0"><b>${p.anc==='anul'?'Anulado':p.anc==='proc'||p.anc==='fall'?'En proceso':'Verificable'}</b><br><span style="font-size:13px;word-break:break-all">Huella ${huella(p.rec)}</span></div></div>`;
}
function anclaje(p){const tx='0x'+hash(p.rec+'tx')+hash(p.rec+'ty')+hash(p.rec+'tz')+hash(p.rec+'tw')+hash(p.rec+'tv'),a=p.anc||'verif';
  const st=[['Creado','al validar el pago','16:05:12','ok'],a==='fall'?['Envío fallido','5 intentos con espera creciente','16:12:40','bad']:['Enviado','transacción firmada','16:05:19','ok'],a==='verif'||a==='anul'?['Anclado','bloque 12.345.678','16:05:41','ok']:a==='proc'?['Anclado','esperando la confirmación de la red','—','wait']:['Anclado','pendiente','—','off']];
  if(a==='anul')st.push(['Anulado','anulación registrada en el contrato','17:20:03','void']);
  const icn={ok:'check',bad:'x',wait:'clock',off:'clock',void:'void'};
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="font-size:17px">Registro en la red</h2>${pill(recSt(p))}</div><span class="muted" style="font-size:13px;margin-top:-8px">Polygon PoS · red de pruebas Amoy</span>
  <ol class="tl">${st.map(([t,d,h,k])=>`<li><span class="dot ${k==='ok'?'':k}">${ic(icn[k],14,3)}</span><div><b>${t}</b><span>${h==='—'?d:p.fecha+' '+h+' · '+d}</span></div></li>`).join('')}</ol>
  ${a==='fall'||a==='proc'?'':`<dl class="kv" style="font-size:13.5px"><dt>Transacción</dt><dd style="word-break:break-all;font-family:ui-monospace,monospace;font-weight:500">${tx}…</dd><dt>Explorador</dt><dd><a href="#" data-explorer>amoy.polygonscan.com</a></dd></dl>`}`}
function recActions(p){const a=p.anc||'verif';
  if(a==='fall')return UI.who==='admin'?`<div class="alert s-warn">${ic('warn',20,2)}<span>El anclaje falló tras 5 intentos. Reintentar lo devuelve a la cola sin intervención técnica.</span></div><button class="btn btn-p" data-retry="${p.rec}" style="align-self:flex-start">${ic('refresh',18,2)}Reintentar anclaje</button>`:`<div class="alert s-warn">${ic('warn',20,2)}<span>El anclaje falló. El administrador puede reintentarlo.</span></div>`;
  if(a==='anul')return `<div class="alert s-void">${ic('void',20,2)}<span><b>Motivo de la anulación:</b> ${esc(p.motivoAnul)}</span></div>`;
  if(a!=='verif'||UI.who!=='admin')return '';
  if(!UI.anular)return `<button class="btn btn-bad" data-anulopen style="align-self:flex-start">Anular recibo…</button>`;
  return `<div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--hair);animation:fadeUp .3s var(--ease)"><b>Anular ${p.rec}</b><span class="muted" style="font-size:13.5px">El recibo no se borra: queda anulado, la anulación se registra en el contrato y la verificación mostrará «Anulado».</span><label class="field" for="anulTxt">Motivo<textarea class="inp" id="anulTxt" rows="3" placeholder="Por ejemplo: el pago se validó dos veces"></textarea></label><div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-q" data-anulcancel>Volver</button><button class="btn btn-p" style="background:var(--bad)" data-anulok="${p.rec}">Anular recibo</button></div></div>`}
function sRecibo(){

}
function bindStaff(){

  v.querySelectorAll('[data-count]').forEach(el=>{const to=parseFloat(el.dataset.count),int=el.dataset.int;const t0=performance.now(),dur=700;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),val=to*e;el.textContent=int?Math.round(val):fmt(val);if(k<1)requestAnimationFrame(step)};
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(step)});

    <section class="card"><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Póliza</th><th>Cliente</th><th>Aseguradora</th><th class="r">Monto</th><th>Recibo</th></tr></thead><tbody>${rows.map(p=>`<tr><td class="num">${p.fecha}</td><td>${p.code}</td><td>${esc(p.cli)}</td><td>${esc(asegOf(p))}</td><td class="r num"><b>${fmt(p.monto)}</b></td><td><button class="linkbtn" data-rec="${p.rec}">${p.rec}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No hay pagos validados con estos filtros.</td></tr>'}</tbody>${rows.length?`<tfoot><tr><td colspan="4">Total · ${rows.length} pagos</td><td class="r num">${fmt(tot)}</td><td></td></tr></tfoot>`:''}</table></div></section>

  const g={};D.cartera.forEach(c=>{const k=asegByCode(c.code);g[k]=g[k]||{n:k,v:0,q:0,max:0};g[k].v+=c.monto;g[k].q++;g[k].max=Math.max(g[k].max,c.dias)});

  <div class="grid3c">${Object.values(g).sort((a,b)=>b.v-a.v).map(x=>`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:14px">${esc(x.n)}</span><b style="font:var(--dw) 28px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--bad)">${fmt(x.v)}</b><span class="muted" style="font-size:13px">${x.q} ${x.q===1?'cuota vencida':'cuotas vencidas'} · atraso máximo ${x.max} días</span></section>`).join('')}</div>

  const p=D.pays.find(x=>x.id===id);
  return `<div class="done"><svg class="big" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring" cx="50" cy="50" r="46" fill="none" stroke="var(--info)" stroke-width="5"/><path class="tick" d="M50 28v24l14 9" fill="none" stroke="var(--info)" stroke-width="7" stroke-linecap="round"/></svg>
  <h1>Recibimos su reporte</h1><b class="amt-big burst">${fmt(p.monto)}</b><span class="muted" style="max-width:280px">El personal de Oasis lo revisará y le avisaremos por correo. Mientras tanto la cuota ${p.cuotas.join(', ')} queda «En validación».</span></div>
  <div class="mfoot"><button class="btn btn-p btn-lg" data-mtab="inicio">Volver al inicio</button></div>`;
}
function mPagos(){
  myPays().forEach(p=>{if(p.notice)p.notice=false});
  const l=myPays();
  return `${mTop('Mis pagos',false)}<div class="mbody"><button class="listrow" data-mgo="verificar">${ic('shield',22,2,'style="color:var(--ok);flex:none"')}<span class="main"><b>Verificar un recibo</b><span>Compruebe que un recibo es auténtico</span></span>${ic('chev',20,2,'class="chev" style="color:var(--ink2)"')}</button>
  ${l.map((p,i)=>`<button class="listrow" style="animation:fadeUp .35s ${i*30}ms var(--ease) both" ${p.rec?`data-mgo="recibo" data-mp="${p.rec}"`:'disabled'}><span class="main"><b>${D.pols[p.pol].ramo} · cuota ${p.cuotas.join(', ')}</b><span>${p.fecha}${p.rec?' · '+p.rec:''}${p.estado==='rech'?' · '+esc(p.motivo):''}</span></span><span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><b class="num">${fmt(p.monto)}</b>${pill(p.estado==='val'?'val':p.estado)}</span></button>`).join('')}</div>${mNav('pagos')}`;
}
function mRecibo(code){const p=findRec(code);return `${mTop('Recibo')}<div class="mbody"><section class="card mrec receipt" style="padding:18px">${receiptDoc(p,true)}</section><button class="btn btn-s" data-mmail="${p.rec}">${ic('mail',18)}Enviar a mi correo</button></div>`}
function mVerifOther(p,st){const anul=st==='anul';return `<div class="done" style="flex:none;padding:12px 0"><svg class="big" viewBox="0 0 100 100" aria-hidden="true" style="width:90px;height:90px"><circle class="ring" cx="50" cy="50" r="46" fill="none" stroke="var(--${anul?'void':'info'})" stroke-width="5"/>${anul?'<path class="tick" d="M31 31l38 38" fill="none" stroke="var(--void)" stroke-width="7" stroke-linecap="round"/>':'<path class="tick" d="M50 28v24l14 9" fill="none" stroke="var(--info)" stroke-width="7" stroke-linecap="round"/>'}</svg><h1 style="font-size:22px">${anul?'Recibo anulado':'En proceso'}</h1><span class="muted">${anul?'Oasis Seguros anuló este recibo. Motivo: '+esc(p.motivoAnul):'El recibo existe y todavía se está registrando. Vuelva a verificarlo en unos minutos.'}</span></div>`}
function mVerificar(){
  const r=UI.verify;let p=r?findRec(r):null;if(p&&!p.mine)p=null;const st=p?(p.anc==='anul'?'anul':(p.anc==='proc'||p.anc==='fall')?'proc':'ok'):null;
  return `${mTop('Verificar recibo')}<div class="mbody">${!r?`<span class="muted" style="font-size:14.5px">Escriba el código que aparece en el recibo, por ejemplo OAS-2026-000212.</span>`:''}
  ${r&&p&&st!=='ok'?mVerifOther(p,st):''}${r&&p&&st==='ok'?`<div class="done" style="flex:none;padding:12px 0"><svg class="big" viewBox="0 0 100 100" aria-hidden="true" style="width:90px;height:90px"><circle class="ring" cx="50" cy="50" r="46" fill="none" stroke="var(--ok)" stroke-width="5"/><path class="tick" d="M30 52l13 13 27-29" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 style="font-size:22px">Recibo auténtico</h1><span class="muted">Emitido por Oasis Seguros y registrado en la red.</span></div><section class="card mrec"><dl class="kv"><dt>Recibo</dt><dd>${p.rec}</dd><dt>Cliente</dt><dd>${esc(p.cli)}</dd><dt>Monto</dt><dd>${fmt(p.monto)}</dd><dt>Fecha</dt><dd>${p.fecha}</dd></dl></section>`:''}
  ${r&&!p?`<div class="done" style="flex:none;padding:12px 0"><svg class="big" viewBox="0 0 100 100" aria-hidden="true" style="width:90px;height:90px"><circle class="ring" cx="50" cy="50" r="46" fill="none" stroke="var(--bad)" stroke-width="5"/><path class="tick" d="M36 36l28 28M64 36 36 64" fill="none" stroke="var(--bad)" stroke-width="7" stroke-linecap="round"/></svg><h1 style="font-size:22px">Recibo no encontrado</h1><span class="muted">Revise el código. Solo puede verificar los recibos de sus propias pólizas.</span></div>`:''}
  <form id="mvForm" style="display:flex;flex-direction:column;gap:10px"><label class="field" for="mvIn">Código del recibo<input class="inp" id="mvIn" placeholder="OAS-2026-000000" value="${esc(r||'')}"></label><button class="btn btn-p btn-lg" type="submit">Verificar</button></form></div>`;
}
function mCuenta(){return `${mTop('Mi cuenta',false)}<div class="mbody"><section class="card sumbox" style="align-items:center;text-align:center"><span class="av" style="width:64px;height:64px;font-size:20px;background:var(--gold);color:var(--on-gold)">MG</span><b style="font-size:18px">María Fernanda Guamán</b><span class="muted">mf.guaman@correo.ec</span></section><button class="listrow" data-logout>${ic('out',22,2)}<span class="main"><b>Cerrar sesión</b></span></button></div>${mNav('cuenta')}`}

function bindClient(){
  const s=mCur().s;
  if(s==='datos'){const cb=$('#mOk'),b=$('#mAccept');cb.onchange=()=>b.disabled=!cb.checked;b.onclick=()=>{D.consent=true;mTab('inicio');toast('Gracias. Ya puede ver sus pólizas.')}}
  if(s==='reportar'){
    $('#rpPol').onchange=e=>{mCur().p=e.target.value;UI.m.dir=null;render()};
    $('#rpCu').onchange=()=>{const pol=D.pols[$('#rpPol').value],c=payable(pol).find(x=>String(x.n)===$('#rpCu').value);$('#rpMo').value=c.monto.toFixed(2).replace('.',',')};
    $('#rpFile').onchange=e=>{const f=e.target.files[0];$('#rpFileName').textContent=f?f.name:'Foto o PDF'};
    const send=e=>{e&&e.preventDefault();const ref=$('#rpRef').value.trim();
      if(!ref){UI.rep={err:'Escriba el número de referencia de su comprobante.'};const keep=[$('#rpCu').value,$('#rpMo').value];UI.m.dir=null;render();$('#rpCu').value=keep[0];$('#rpMo').value=keep[1];$('#rpRef').focus();return}
      UI.rep={};const id=$('#rpPol').value,pol=D.pols[id],n=+$('#rpCu').value,m=parseFloat($('#rpMo').value.replace(/\./g,'').replace(',','.'))||0,f=$('#rpFile').files[0],fd=$('#rpFe').value.split('-');
      const q=pol.cuotas.find(x=>x.n===n);q.estado='validacion';
      const np={id:'n'+Date.now(),cli:'María Fernanda Guamán',ini:'MG',mine:true,pol:id,code:pol.code,cuotas:[n],monto:m,fecha:fd[2]+'/'+fd[1]+'/'+fd[0],metodo:$('#rpMet').value,banco:$('#rpBa').value,ref,origen:'Comprobante del cliente',por:'cliente',estado:'por',hace:'ahora',file:f?f.name:null,comp:f?true:false};
      D.pays.unshift(np);D.cartera=D.cartera.filter(x=>!(x.mine&&x.code===pol.code&&x.cuota===n));
      UI.m.stack=[{s:'inicio'},{s:'reportado',p:np.id}];UI.m.dir='fwd';render()};
    $('#repForm').onsubmit=send;$('#repBtn').onclick=send;
  }
  if(s==='verificar'){$('#mvForm').onsubmit=e=>{e.preventDefault();UI.verify=$('#mvIn').value.trim()||null;UI.m.dir=null;render()}}
}

/* ---------- actions (delegated) ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t||!$('#app').contains(t))return;
  const d=t.dataset;
  if('logout' in d){UI.logErr=false;setRole('login');return}
  if(d.go){if(d.go==='registrar')UI.regErr=null;if(d.go==='cargar')UI.carga={step:'form',aseg:UI.carga.aseg,ids:[]};go(d.go);return}
  if(d.goadm){UI.adm=d.goadm;go('admin');return}
  if(d.adm){UI.adm=d.adm;UI.newUser=false;UI.codes=null;render();return}
  if(d.rp){UI.rp=d.rp;render();return}
  if(d.exp){toast(`Descargaría el reporte en ${d.exp} con los filtros aplicados.`);return}
  if('nuopen' in d){UI.newUser=true;UI.nuErr=null;render();return}
  if('nucancel' in d){UI.newUser=false;UI.nuErr=null;render();return}
  if(d.ureset){const u=D.users.find(x=>x.id===d.ureset);logA('RESTABLECER_CONTRASENA','Restableció una contraseña',u.n);toast(`Enviamos una contraseña temporal a ${esc(u.c)} y cerramos sus sesiones.`);return}
  if(d.utoggle){const u=D.users.find(x=>x.id===d.utoggle);u.act=!u.act;logA(u.act?'ACTIVAR_USUARIO':'DESACTIVAR_USUARIO',u.act?'Activó un usuario':'Desactivó un usuario',u.n);toast(u.act?`${esc(u.n)} puede volver a ingresar.`:`${esc(u.n)} ya no puede ingresar; cerramos sus sesiones.`);render();return}
  if(d.cta){const c=D.ctas[+d.cta];c.st='pend1';logA('CREAR_CUENTA_CLIENTE','Creó la cuenta de un cliente',c.cli);toast(`Cuenta creada. La contraseña temporal llegó a ${esc(c.c)}.`);render();return}
  if(d.retry){const p=findRec(d.retry);p.anc='proc';logA('REINTENTAR_ANCLAJE','Reintentó el anclaje de un recibo','Recibo '+p.rec);toast(`Recibo ${p.rec} devuelto a la cola de anclaje.`);render();
    setTimeout(()=>{p.anc=undefined;D.anc.anclados++;logA('ANCLAR','Ancló un recibo','Recibo '+p.rec,'Sistema');if(UI.role==='staff')render()},2200);return}
  if('anulopen' in d){UI.anular=true;render();$('#anulTxt').focus();return}
  if('anulcancel' in d){UI.anular=false;render();return}
  if(d.anulok){const p=findRec(d.anulok),msg=($('#anulTxt').value||'').trim();
    if(!msg){$('#anulTxt').setAttribute('aria-invalid','true');$('#anulTxt').focus();return}
    p.anc='anul';p.motivoAnul=msg;UI.anular=false;logA('ANULAR','Anuló un recibo','Recibo '+p.rec);toast(`Recibo ${p.rec} anulado. La verificación mostrará «Anulado».`);render();return}
  if(d.sw){const [k,i]=d.sw.split(':'),x=D[k][+i];x.act=!x.act;logA('EDITAR_CATALOGO',(x.act?'Activó ':'Desactivó ')+(k==='ramos'?'un ramo':'un método de pago'),x.n);render();return}
  if('newaseg' in d||d.editaseg){toast('Abriría el formulario de la aseguradora: nombre y RUC de 13 dígitos.');return}
  if('codes' in d){UI.codes=Array.from({length:10},(_,i)=>{const h=hash('rc'+i+Date.now()).toUpperCase();return h.slice(0,4)+'-'+h.slice(4,8)});logA('REGENERAR_CODIGOS','Generó códigos de recuperación','Cuenta propia');render();return}
  if('closeoth' in d){toast('Cerramos sus otras sesiones.');return}
  if('explorer' in d){e.preventDefault();toast('Abriría la transacción en el explorador público de Polygon.');return}
  if('plantilla' in d){toast('Descargaría la plantilla de cobros (.xlsx).');return}
  if('cargareset' in d){UI.carga={step:'form',aseg:UI.carga.aseg,ids:[]};render();return}
  if('cargaok' in d){const c=UI.carga,ids=[];cargaFilas(c.aseg).filter(r=>r.ok).forEach((r,i)=>{const id='c'+Date.now()+i;ids.push(id);D.pays.unshift({id,cli:r.cli,ini:r.cli.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join(''),code:r.pol,cuotas:[1],monto:r.monto,fecha:r.fecha,metodo:'Débito bancario',banco:c.aseg,ref:r.ref,origen:'Archivo de la aseguradora',por:'Andrea Villacís',estado:'por',hace:'ahora',deb:true,arch:c.file,fila:r.f})});c.ids=ids;c.step='done';logA('IMPORTAR','Cargó la notificación de cobros',c.aseg+' · '+ids.length+' filas');toast(`${ids.length} pagos registrados. Quedan por validar.`);render();return}
  if('cargaask' in d){UI.carga.confirm=true;render();return}
  if('cargano' in d){UI.carga.confirm=false;render();return}
  if('cargaval' in d){D.pays.filter(p=>UI.carga.ids.includes(p.id)&&p.estado==='por').forEach(p=>{p.estado='val';p.rec=newRec();p.hoy=true;D.recaudado+=p.monto});UI.carga.confirm=false;toast('Pagos validados. Se emitieron sus recibos.');render();return}
  if(d.tab){UI.tab=d.tab;render();return}
  if(d.val){go('validar',d.val);return}
  if(d.rec){go('recibo',d.rec);return}
  if(d.cli){go('cliente',d.cli);return}
  if('rejopen' in d){UI.rej.open=true;render();return}
  if('rejcancel' in d){UI.rej={open:false,chip:null};render();return}
  if(d.chip){UI.rej.chip=d.chip;render();return}
  if(d.valok){const p=D.pays.find(x=>x.id===d.valok);t.disabled=true;t.innerHTML=ic('check',18,2.6)+'Validado';
    setTimeout(()=>{p.estado='val';p.rec=newRec();p.hoy=true;p.notice=!!p.mine;D.recaudado+=p.monto;logA('VALIDAR','Validó un pago','Pago '+p.code+' · cuota '+p.cuotas.join(', '));
      if(p.mine){const pol=D.pols[p.pol];p.cuotas.forEach(n=>{const q=pol.cuotas.find(x=>x.n===n);if(q)q.estado='pagada'})}
      toast(`Pago validado. Recibo ${p.rec} emitido y enviado a ${esc(p.cli.split(' ')[0])}.`);go('recibo',p.rec)},450);return}
  if(d.rejok){const p=D.pays.find(x=>x.id===d.rejok);const msg=($('#rejTxt').value||'').trim();
    if(!msg){$('#rejTxt').setAttribute('aria-invalid','true');$('#rejTxt').focus();return}
    p.estado='rech';p.motivo=msg;p.notice=!!p.mine;logA('RECHAZAR','Rechazó un pago','Pago '+p.code+' · cuota '+p.cuotas.join(', '));
    if(p.mine){const pol=D.pols[p.pol];p.cuotas.forEach(n=>{const q=pol.cuotas.find(x=>x.n===n);if(q)q.estado=q.vence<TODAY?'vencida':'pendiente'})}
    UI.rej={open:false,chip:null};toast(`Pago rechazado. Avisamos a ${esc(p.cli.split(' ')[0])} con el motivo.`);UI.tab='por';go('pagos');return}
  if(d.remind){const c=D.cartera.find(x=>x.id===d.remind);c.rem=true;toast(`Recordatorio enviado a ${esc(c.cli)}.`);render();return}
  if('remindall' in d){D.cartera.forEach(c=>c.rem=true);toast(`Recordatorios enviados a ${D.cartera.length} clientes.`);render();return}
  if(d.mail){toast(`Recibo ${d.mail} enviado por correo.`);return}
  if(d.mmail){toast('Enviamos el recibo a mf.guaman@correo.ec.');return}
  if('mback' in d){mBack();return}
  if(d.mtab){if(d.mtab==='verificar')UI.verify=null;mTab(d.mtab);return}
  if(d.mgo){if(d.mgo==='verificar')UI.verify=null;if(d.mgo==='reportar')UI.rep={};mGo(d.mgo,d.mp);return}
});

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(UI.role==='login'){app.innerHTML=vLogin();bindLogin()}
  else if(UI.role==='staff'){app.innerHTML=vStaff();bindStaff()}
  else{app.innerHTML=vClient();bindClient();UI.m.dir=null}
}
document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
$('#resetBtn').onclick=()=>{D=seed();UI.verify=null;UI.carga={step:'form',aseg:'Sweaden',ids:[]};UI.tab='por';toast('Datos de ejemplo restablecidos.');setRole(UI.role)};
document.documentElement.lang='es-EC';
render();
})();
</script>

</body></html>
