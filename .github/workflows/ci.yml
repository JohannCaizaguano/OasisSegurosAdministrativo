name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Sin permisos por defecto: cada job declara los suyos (HT-14).
permissions: {}

env:
  JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-1234
  JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-1234

jobs:
  calidad:
    name: Lint, build, typecheck y dependency-cruiser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `build` va antes de `typecheck` porque `apps/api` genera el cliente de
      # Prisma y `packages/contracts` los tipos de viem durante la compilación.
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm deps:check

  seguridad:
    name: Seguridad (pnpm audit, Semgrep, gitleaks, zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks revisa todo el historial, no solo el último commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # Sin `pnpm install` no hay store que guardar: el caché automático por `packageManager` falla.
          package-manager-cache: false
      # Las excepciones viven en `auditConfig` de pnpm-workspace.yaml, con motivo y fecha.
      - name: pnpm audit (dependencias de producción)
        run: pnpm audit --prod --audit-level=high
      - name: Semgrep CE
        run: >-
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep:1.180.0
          semgrep scan --metrics=off --config p/typescript --config p/nodejs
          --config p/owasp-top-ten --severity ERROR --error apps/api/src apps/web/src
      - name: gitleaks (todo el historial)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archivo}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archivo}" gitleaks
          ./gitleaks git --redact --no-banner .
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: zizmor (workflows de GitHub Actions)
        run: uvx zizmor@1.30.1 --min-severity high .github/workflows

  contratos:
    name: Contratos (compile, tests, cobertura, solhint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oasis/contracts build
      - run: pnpm --filter @oasis/contracts lint
      - run: pnpm --filter @oasis/contracts test
      - run: pnpm --filter @oasis/contracts typecheck
      # `reporte` corre los tests con --coverage y --gas-stats, verifica el
      # umbral de cobertura y regenera REPORTE-COBERTURA.md y REPORTE-GAS.md.
      # Si el umbral no se alcanza, el job falla.
      - run: pnpm --filter @oasis/contracts reporte
      # El ABI compartido se genera desde el contrato: si alguien lo editó a
      # mano o cambió el contrato sin reexportarlo, el diff delata la deriva.
      - run: pnpm --filter @oasis/contracts export-abi
      - name: El ABI exportado debe coincidir con el contrato
        run: |
          if ! git diff --exit-code -- packages/shared/src/abi/; then
            echo "::error::El ABI de packages/shared no coincide con el contrato compilado."
            echo "Ejecuta 'pnpm --filter @oasis/contracts export-abi' y versiona el resultado."
            exit 1
          fi

  slither:
    name: Slither (análisis estático)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Slither y solc
        run: |
          pipx install slither-analyzer==0.11.6
          pipx install solc-select
          solc-select install 0.8.28
          solc-select use 0.8.28
      # Se analiza el archivo del contrato y no el proyecto Hardhat: crytic-compile no
      # resuelve los tests Foundry que Hardhat 3 compila junto al contrato.
      - name: Analizar RegistroRecibos.sol
        run: >-
          slither packages/contracts/contracts/RegistroRecibos.sol
          --config-file packages/contracts/slither.config.json

  api:
    name: API (unitarias y e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oasis" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oasis/shared build
      # El cliente de Prisma no se versiona (src/generated está en .gitignore):
      # hay que generarlo antes de migrar, sembrar o compilar el API.
      - name: Generar el cliente de Prisma
        run: pnpm --filter @oasis/api exec prisma generate
      - run: pnpm --filter @oasis/api run test
      - name: Migrar y sembrar la base de datos
        working-directory: apps/api
        run: |
          cp ../../.env.example .env
          pnpm exec prisma migrate deploy
          pnpm run seed
      - name: Nodo Hardhat y anclaje de prueba
        run: |
          pnpm --filter @oasis/contracts exec hardhat node --hostname 127.0.0.1 > /tmp/hardhat.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -X POST http://127.0.0.1:8545 -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' > /dev/null && break
            sleep 1
          done
          pnpm dev:chain
          pnpm --filter @oasis/api run build
      - name: Script del hash de prueba contra el nodo local
        run: |
          CONTRACT_ADDRESS=$(grep '^CONTRACT_ADDRESS=' apps/api/.env | cut -d= -f2) \
            pnpm --filter @oasis/contracts exec hardhat run scripts/registrar-prueba.ts --network localhost
      - name: Pruebas e2e
        working-directory: apps/api
        run: pnpm run test:e2e

  web:
    name: SPA (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oasis/shared build
      - run: pnpm --filter @oasis/web run test
      - run: pnpm --filter @oasis/web run build

  docker:
    name: Imágenes Docker (sin publicar)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          tags: oasis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrator
          push: false
          tags: oasis-api-migrator:ci
          cache-from: type=gha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: false
          tags: oasis-web:ci
          cache-from: type=gha
